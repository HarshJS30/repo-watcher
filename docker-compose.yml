services:
  database:
    image: postgres:16
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: repo_watcher
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/repo_watcher
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - AUTH_TRUST_HOST=true
    depends_on:
      - database
      - redis
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/repo_watcher
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
    depends_on:
      - database
      - redis
    env_file:
      - .env

volumes:
  db_data:
  redis_data: